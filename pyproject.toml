[project]
name = "jeju-lifepath"
version = "0.1.0"
description = "JEJU LifePath AI — 제주 보행 경로·생활편의 탐색 Agent"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7,<3",
    "networkx>=3.2,<4",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jeju_lifepath"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
