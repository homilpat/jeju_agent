[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jeju-lifepath"
version = "0.0.1"
description = "JEJU LifePath AI — unified pedestrian graph, constraint engine and CA-MOR routing (G0 foundation)"
readme = "README.md"
requires-python = ">=3.12"  # networkx==3.7 requires 3.12+
# Runtime dependencies are pinned for reproducible installs (REQUIREMENTS §7).
dependencies = [
    "pydantic==2.14.2",
    "networkx==3.7",
    "shapely==2.2.0",
    "pyproj==3.8.0",
    "fastapi==0.163.1",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==9.2.0",
    "ruff==0.17.3",
]

# Monorepo layout: src/backend (Python engine/agent), src/frontend (UI, G10).
# Tests mirror it: tests/backend, tests/frontend.
[tool.setuptools.packages.find]
where = ["src/backend"]

[tool.pytest.ini_options]
testpaths = ["tests/backend", "tests/frontend"]
addopts = "-ra --strict-markers"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src/backend", "tests"]
# Requirement/architecture documents are source-of-truth text; never auto-reformat them.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "PL", "PT"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # Korean text in strings/comments/docstrings is intentional
    "PLR0913",                     # schema-like constructors legitimately take many arguments
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]
